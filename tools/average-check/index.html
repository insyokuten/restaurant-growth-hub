description: 客数・営業日数・追加食材原価率から、客単価100円アップ時の月間効果を試算します。

---
<section class="section tool"><p class="eyebrow">FREE SIMULATOR</p><h1>客単価100円アップの効果を試算</h1><p>1日あたりの客数、月間営業日数、増分の食材原価率を入力してください。</p><div class="form-grid"><label>1日あたりの客数（人）<input id="guests" type="number" min="0" max="100000" step="1" value="30"></label><label>月間営業日数（日）<input id="days" type="number" min="0" max="31" step="1" value="25"></label><label>増分の食材原価率（%）<input id="cost" type="number" min="0" max="100" step="0.1" value="30"></label></div><button id="calc" class="button" type="button">試算する</button><div id="result" role="status" aria-live="polite" class="result">数値を入力して「試算する」を押してください。</div><p class="muted">※全客が対象・客数不変と仮定した概算です。人件費、販促費、決済手数料、税金などは考慮していません。</p></section>
<script>
(function(){
const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
const read=id=>{const raw=document.getElementById(id).value.trim();return raw===''?NaN:Number(raw)};
document.getElementById('calc').addEventListener('click',()=>{
 const g=read('guests'),d=read('days'),c=read('cost'),el=document.getElementById('result');
 if(![g,d,c].every(Number.isFinite)||!Number.isInteger(g)||g<0||g>100000||!Number.isInteger(d)||d<0||d>31||c<0||c>100){el.textContent='入力値を確認してください。客数は0～100000人、営業日数は0～31日、原価率は0～100％です。';return;}
 const sales=g*d*100,contribution=sales*(1-c/100);
 el.textContent='月間売上増加額：'+yen(sales)+' ／ 追加食材費控除後の概算：'+yen(contribution);
});
})();
</script>
